<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch A1 Trainer</title>
<style>
:root{--ink:#16181d;--muted:#5b6170;--accent:#0a84ff;--accent2:#bf5af2;--ok:#30d158;--bad:#ff453a;
  --glass:rgba(255,255,255,.42);--glass-strong:rgba(255,255,255,.62);--glass-weak:rgba(255,255,255,.22);
  --edge:rgba(255,255,255,.75);--edge-dim:rgba(255,255,255,.28);--shadow:0 10px 40px -10px rgba(30,40,80,.35);--line:rgba(20,30,60,.10);
  --b1:#ffffff;--b2:#d9dbe0;--b3:#c9ccd3;--b4:#eef0f3;--base:#e4e6ea;--bg:var(--glass-weak);--card:var(--glass);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f4f8;--muted:#a3a9b8;--accent:#409cff;--accent2:#da8fff;--glass:rgba(40,44,58,.42);--glass-strong:rgba(50,55,72,.66);--glass-weak:rgba(255,255,255,.06);--edge:rgba(255,255,255,.22);--edge-dim:rgba(255,255,255,.08);--shadow:0 12px 44px -8px rgba(0,0,0,.6);--line:rgba(255,255,255,.09);--b1:#2a2d33;--b2:#16181c;--b3:#33363d;--b4:#1e2025;--base:#0e0f12;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f2f4f8;--muted:#a3a9b8;--accent:#409cff;--accent2:#da8fff;--glass:rgba(40,44,58,.42);--glass-strong:rgba(50,55,72,.66);--glass-weak:rgba(255,255,255,.06);--edge:rgba(255,255,255,.22);--edge-dim:rgba(255,255,255,.08);--shadow:0 12px 44px -8px rgba(0,0,0,.6);--line:rgba(255,255,255,.09);--b1:#2a2d33;--b2:#16181c;--b3:#33363d;--b4:#1e2025;--base:#0e0f12;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.blobs{position:fixed;inset:-20%;z-index:-1;filter:blur(70px);pointer-events:none}
.blobs i{position:absolute;border-radius:50%;opacity:.85;animation:drift 28s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:55vw;height:55vw;left:0;top:5%;background:var(--b1)}
.blobs i:nth-child(2){width:45vw;height:45vw;right:0;top:0;background:var(--b2);animation-duration:34s}
.blobs i:nth-child(3){width:50vw;height:50vw;left:30%;bottom:-5%;background:var(--b3);animation-duration:40s}
.blobs i:nth-child(4){width:35vw;height:35vw;right:10%;bottom:10%;background:var(--b4);animation-duration:24s}
@keyframes drift{to{transform:translate(8vw,-6vh) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.blobs i{animation:none}}
header,.card{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--edge-dim);box-shadow:var(--shadow),inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge-dim)}
header{margin:12px auto 0;max-width:900px;width:calc(100% - 32px);padding:12px 18px;border-radius:999px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:12px;z-index:5}
header h1{margin:0;font-size:1.1rem}
header a{color:var(--ink);text-decoration:none;padding:4px 12px;border-radius:999px;background:var(--glass-weak);border:1px solid var(--edge-dim)}
header .prog{margin-left:auto;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
main{max-width:900px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{border-radius:22px;padding:18px}
.lesson{cursor:pointer;transition:transform .2s,box-shadow .2s}
.lesson:hover{transform:translateY(-3px);box-shadow:0 18px 40px -14px var(--accent),inset 0 1px 0 var(--edge)}
.lesson .n{color:var(--accent);font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
.lesson .t{font-weight:600}
.lesson .s{color:var(--muted);font-size:.85rem}
.lesson .bar{height:6px;background:var(--glass-weak);border-radius:99px;margin-top:10px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.lesson .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#64d2ff)}
.mod{margin:24px 4px 10px;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--edge-dim);background:var(--glass-weak);color:var(--ink);padding:8px 16px;transition:transform .15s,background .2s;box-shadow:inset 0 1px 0 var(--edge-dim)}
button:hover{background:var(--glass-strong)}button:active{transform:scale(.95)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:rgba(255,255,255,.3);color:#fff;font-weight:600}
.tabs{display:inline-flex;gap:2px;flex-wrap:wrap;margin:12px 0;padding:4px;border-radius:999px;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge-dim)}
.tabs button{border:none;background:none;box-shadow:none}
.tabs button.on{background:var(--glass-strong);box-shadow:0 2px 8px -2px rgba(0,0,0,.25),inset 0 1px 0 var(--edge)}
.flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:1.8rem;font-weight:600}
.flash small{font-size:.95rem;color:var(--muted);font-weight:400;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{text-align:left;border-radius:16px;padding:12px 16px}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 25%,transparent);box-shadow:0 0 16px -4px var(--ok)}
.opts button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 25%,transparent)}
input[type=text]{font:inherit;width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--edge-dim);background:var(--glass-weak);color:var(--ink);box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
input[type=text]:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.fb{margin-top:10px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.gram h3{margin-top:0}
table{border-collapse:separate;border-spacing:0;width:100%;margin:8px 0;border-radius:14px;overflow:hidden;border:1px solid var(--edge-dim)}
td,th{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
th{background:var(--glass-weak);font-weight:600}
.dlg p{margin:8px 0}.dlg b{color:var(--accent)}
.speak{border:none;background:none;box-shadow:none;padding:2px 6px;font-size:1rem}
.muted{color:var(--muted)}
h2{margin:8px 0 2px}
</style>
</head>

const KEY="a1trainer";
try{const t=localStorage.getItem("menschenReaderTheme");if(t)document.documentElement.dataset.theme=t}catch(e){}
let st={}; try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const app=document.getElementById("app");
const say=t=>{try{const u=new SpeechSynthesisUtterance(t.split("/")[0]);u.lang="de-DE";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const score=i=>Math.min(100,st[i]||0);
const esc=s=>s.replace(/"/g,"&quot;");

function home(){
  const tot=Math.round(L.reduce((a,_,i)=>a+score(i),0)/L.length);
  document.getElementById("prog").textContent=`Fortschritt: ${tot}%`;
  let h="",mod=0;
  L.forEach((l,i)=>{
    if(l.m!==mod){if(mod)h+="</div>";mod=l.m;h+=`<div class="mod">Modul ${mod}</div><div class="grid">`}
    h+=`<div class="card lesson" onclick="lesson(${i})"><div class="n">Lektion ${i+1}</div><div class="t">${l.t}</div><div class="s">${l.s}</div><div class="bar"><i style="width:${score(i)}%"></i></div></div>`;
  });
  app.innerHTML=h+"</div>";
}

let cur=0;
function lesson(i,tab="vok"){
  cur=i;const l=L[i];
  app.innerHTML=`<button onclick="home()">← Übersicht</button>
  <h2>Lektion ${i+1}: ${l.t}</h2><p class="muted">${l.s} · Grammatik: ${l.g}</p>
  <div class="tabs">${[["vok","📇 Wortschatz"],["quiz","✅ Quiz"],["dlg","💬 Dialog"],["gram","📘 Grammatik"],["luck","✍️ Lückentext"]].map(([k,n])=>`<button class="${k===tab?"on":""}" onclick="lesson(${i},'${k}')">${n}</button>`).join("")}</div>
  <div id="pane"></div>`;
  ({vok,quiz,dlg,gram,luck})[tab](l);
}

function vok(l){
  let k=0,flip=false;const p=document.getElementById("pane");
  const r=()=>{const [de,en]=l.v[k];
    p.innerHTML=`<div class="card flash" id="fc">${flip?en:de}<small>${flip?de:"Klicken zum Umdrehen"} · ${k+1}/${l.v.length}</small></div>
    <div class="row"><button onclick="">◀</button><button class="speak">🔊 Anhören</button><button>▶</button></div>
    <div class="card" style="margin-top:16px"><table>${l.v.map(([d,e])=>`<tr><td><button class="speak" data-t="${esc(d)}">🔊</button> ${d}</td><td>${e}</td></tr>`).join("")}</table></div>`;
    p.querySelector("#fc").onclick=()=>{flip=!flip;r()};
    const b=p.querySelectorAll(".row button");
    b[0].onclick=()=>{k=(k-1+l.v.length)%l.v.length;flip=false;r()};
    b[1].onclick=()=>say(de);
    b[2].onclick=()=>{k=(k+1)%l.v.length;flip=false;r()};
    p.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>say(x.dataset.t));
  };r();
}

function quiz(l){
  const p=document.getElementById("pane"),qs=shuf(l.v).slice(0,8);let k=0,ok=0;
  const r=()=>{
    if(k===qs.length){const pct=Math.round(ok/qs.length*100);st[cur]=Math.max(score(cur),pct);save();
      p.innerHTML=`<div class="card"><h3>Ergebnis: ${ok}/${qs.length} (${pct}%)</h3><p>${pct>=80?"Sehr gut! 🎉":"Weiter üben! 💪"}</p><button class="primary" onclick="lesson(${cur},'quiz')">Nochmal</button></div>`;return}
    const [de,en]=qs[k],rev=Math.random()<.5;
    const opts=shuf([qs[k],...shuf(l.v.filter(x=>x!==qs[k])).slice(0,3)]);
    p.innerHTML=`<div class="card"><p class="muted">Frage ${k+1}/${qs.length}</p><h3>${rev?en:de} ${rev?"":`<button class="speak" onclick="say('${esc(de).replace(/'/g,"\\'")}')">🔊</button>`}</h3>
      <div class="opts">${opts.map((o,j)=>`<button data-j="${j}">${rev?o[0]:o[1]}</button>`).join("")}</div></div>`;
    p.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
      const right=opts[b.dataset.j]===qs[k];if(right)ok++;
      p.querySelectorAll(".opts button").forEach(x=>{x.disabled=true;if(opts[x.dataset.j]===qs[k])x.classList.add("ok")});
      if(!right)b.classList.add("bad");
      setTimeout(()=>{k++;r()},900);
    });
  };r();
}

function dlg(l){
  const p=document.getElementById("pane");
  p.innerHTML=`<div class="card dlg">${l.d.map(([w,t])=>`<p><b>${w}:</b> ${t} <button class="speak" data-t="${esc(t)}">🔊</button></p>`).join("")}
  <div class="row"><button class="primary" id="all">▶ Ganzen Dialog abspielen</button></div></div>
  <p class="muted">Tipp: Lies den Dialog laut mit, dann tausche die Rollen.</p>`;
  p.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>say(x.dataset.t));
  p.querySelector("#all").onclick=()=>{try{speechSynthesis.cancel();l.d.forEach(([w,t],i)=>{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;u.pitch=i%2?.8:1.2;speechSynthesis.speak(u)})}catch(e){}};
}

function gram(l){document.getElementById("pane").innerHTML=`<div class="card gram"><h3>${l.g}</h3>${l.n}</div>`}

function luck(l){
  const p=document.getElementById("pane");
  p.innerHTML=l.c.map(([s,a],i)=>`<div class="card" style="margin-bottom:10px"><p>${i+1}. ${s}</p><input type="text" data-i="${i}" placeholder="Antwort…" autocomplete="off"><div class="fb" id="fb${i}"></div></div>`).join("")+`<button class="primary" id="chk">Prüfen</button>`;
  p.querySelector("#chk").onclick=()=>{
    p.querySelectorAll("input").forEach(x=>{const a=l.c[x.dataset.i][1],ok=x.value.trim().toLowerCase()===a.toLowerCase(),f=document.getElementById("fb"+x.dataset.i);
      f.className="fb "+(ok?"ok":"bad");f.textContent=ok?"✓ Richtig!":`✗ Richtig ist: ${a}`});
  };
}
const hm=location.hash.match(/l=(\d+)/);if(hm&&L[+hm[1]])lesson(+hm[1]);else home();
</script>
